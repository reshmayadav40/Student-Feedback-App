<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Feedback Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <h1><i class="fa-solid fa-graduation-cap"></i> Student Feedback Manager</h1>

    <div class="nav">
      <button id="showFormBtn" class="active"><i class="fa-solid fa-pen-to-square"></i> Submit Feedback</button>
      <button id="showListBtn"><i class="fa-solid fa-list"></i> View All Feedback</button>
    </div>

    <!-- Feedback Form Page -->
    <section id="formPage">
      <h2>Submit Feedback</h2>

      <form id="feedbackForm">
        <div class="input-group">
          <label for="name">Student Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required />
        </div>

        <div class="input-group">
          <label for="rating">Rating</label>
          <select id="rating" required>
            <option value="" disabled selected>Select Rating</option>
            <option value="1">1 - Very Poor 😞</option>
            <option value="2">2 - Poor 😕</option>
            <option value="3">3 - Good 😐</option>
            <option value="4">4 - Very Good 🙂</option>
            <option value="5">5 - Excellent 🤩</option>
          </select>
        </div>

        <div class="input-group">
          <label for="comment">Feedback</label>
          <textarea id="comment" placeholder="Share your thoughts..." required></textarea>
        </div>

        <button type="submit"><i class="fa-solid fa-paper-plane"></i> Submit Feedback</button>
      </form>

      <p id="msg"></p>
    </section>

    <!-- All Feedback Page -->
    <section id="listPage" class="hidden">
      <h2>All Student Feedback</h2>
      <div id="feedbackList"></div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
